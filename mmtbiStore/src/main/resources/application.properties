spring.datasource.url=jdbc:postgresql://localhost:5432/mmtbistore_db
spring.datasource.username=postgres
spring.datasource.password=123456

# Cau hinh Hibernate Code First
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =====================================================================
# CAU HINH BAO MAT (JWT & AUTH)
# =====================================================================
# Khoa ky JWT bi mat (do dai >= 256 bits). Uu tien doc tu bien moi truong JWT_SECRET
security.jwt.secret=${JWT_SECRET:stillus-super-secret-key-that-is-at-least-256-bits-long-2026-stillus}
# Thoi han token (ms), mac dinh 86400000 ms = 24 gio
security.jwt.expiration-ms=86400000

# Thong tin Admin mac dinh tu dong tao lan dau khi bang app_users con trong
security.admin.init.username=${ADMIN_INIT_USERNAME:admin}
security.admin.init.password=${ADMIN_INIT_PASSWORD:Admin@123456}
security.admin.init.full-name=${ADMIN_INIT_FULLNAME:Quan tri vien}

# Cau hinh CORS (cho phep frontend goi API)
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# =====================================================================
# CAU HINH SWAGGER / OPENAPI
# =====================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha

# =====================================================================
# CAU HINH UPLOAD FILE
# =====================================================================
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

